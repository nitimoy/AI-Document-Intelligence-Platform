name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run Black check
        run: black --check .

      - name: Run MyPy
        run: mypy .

      - name: Generate coverage report
        run: pytest --cov=app/services --cov=app/models --cov=app/utils --cov-report=xml --cov-fail-under=80
